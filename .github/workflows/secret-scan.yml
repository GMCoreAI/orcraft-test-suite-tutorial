name: Secret Scan

# Every push and pull request scans the full git history for secrets, so a
# secret committed after the one-off scan of the repository is caught at
# once. The default gitleaks rules apply; this repository needs no allow list.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan reads every commit, not only the working tree.
          fetch-depth: 0

      - name: Scan git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 2
